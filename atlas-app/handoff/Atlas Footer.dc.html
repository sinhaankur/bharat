<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-7c4fb489-3dc0-4dc2-9757-550f2278af31/styles.css">
<script src="_ds/modernist-7c4fb489-3dc0-4dc2-9757-550f2278af31/_ds_bundle.js"></script>
<style>
body { margin: 0; }
a { color: var(--color-text); text-decoration: none; }
a:hover { color: var(--color-accent); }
</style>
</helmet>
<footer data-screen-label="Global footer" style="border-top:2px solid var(--color-divider);background:var(--color-bg)">
  <div style="max-width:1200px;margin:0 auto;padding:56px clamp(20px,5vw,72px) 42px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:42px 28px">
    <div>
      <p style="display:flex;align-items:center;gap:12px;font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:20px;line-height:28px;margin:0"><span style="width:10px;height:10px;background:var(--color-accent)"></span>District Atlas</p>
      <p style="font-size:13px;line-height:22px;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin:14px 0 0;max-width:26ch">Boundary files, census layers, and measured survey plates for every district.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;line-height:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px">Atlas</span>
      <a href="Atlas Home.dc.html#atlas" style="font-size:15px;line-height:24px">Explore</a>
      <a href="Atlas Home.dc.html#atlas" style="font-size:15px;line-height:24px">Districts</a>
      <a href="Atlas Home.dc.html#atlas" style="font-size:15px;line-height:24px">Survey plates</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;line-height:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px">Data</span>
      <a href="Atlas Home.dc.html#data" style="font-size:15px;line-height:24px">Census layers</a>
      <a href="Atlas Home.dc.html#data" style="font-size:15px;line-height:24px">Boundaries</a>
      <a href="Atlas Home.dc.html#data" style="font-size:15px;line-height:24px">Downloads</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;line-height:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px">Project</span>
      <a href="Atlas Mockups.dc.html" style="font-size:15px;line-height:24px">Mockups</a>
      <a href="Atlas Mockups.dc.html" style="font-size:15px;line-height:24px">Handoff</a>
      <a href="Atlas Mockups.dc.html" style="font-size:15px;line-height:24px">GitHub</a>
    </div>
  </div>
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px) 42px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;font-size:13px;line-height:22px;color:color-mix(in srgb, var(--color-text) 70%, transparent)">
    <span>© 2026 India District Atlas</span>
    <span>{{ note }}</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 380}, &quot;note&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Modernist system mockup&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { note: this.props.note ?? 'Modernist system mockup' }; }
}
</script>
</body>
</html>
