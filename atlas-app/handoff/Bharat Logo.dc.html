<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Karla:wght@400;600;700&family=Noto+Sans+Kannada&family=Noto+Sans+Devanagari&family=Noto+Sans+Bengali&family=Noto+Sans+Gurmukhi&family=Noto+Sans+Gujarati&family=Noto+Sans+Oriya&family=Noto+Sans+Telugu&family=Noto+Sans+Malayalam&display=swap" rel="stylesheet">
<style>body { margin: 0; color: #2a2018; }</style>
</helmet>
<div data-screen-label="Bharat logo" style="display:inline-flex;align-items:center;gap:11px;font-family:Karla, sans-serif;color:inherit">
  <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true" style="flex:none"><circle cx="50" cy="50" r="45" fill="none" stroke="#c9862b" stroke-width="4"></circle><circle cx="50" cy="50" r="39" fill="none" stroke="#c9862b" stroke-width="6" stroke-dasharray="2.5 7.7"></circle><text x="50" y="62" font-size="34" text-anchor="middle" font-family="'Noto Sans Kannada','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Gurmukhi','Noto Sans Gujarati','Noto Sans Oriya','Noto Sans Telugu','Noto Sans Malayalam',serif" fill="currentColor" data-bha="1">ಭ</text><circle cx="50" cy="22" r="3.2" fill="currentColor"></circle><path d="M34 72 Q50 64 66 72 M38 79 Q50 72 62 79" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"></path></svg>
  <span><span style="display:block;font-family:'Rozha One',serif;font-size:22px;line-height:1">Bharat<span style="color:#c9862b">.</span></span><span style="display:block;font-size:8.5px;letter-spacing:0.22em;color:#c9862b;margin-top:4px">{{ tagline }}</span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 260, &quot;height&quot;: 80}, &quot;tagline&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;WE ARE HERE&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (window.__bhaTimer || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const G = ['\u0CAD', '\u092D', '\u09AD', '\u0A2D', '\u0AAD', '\u0B2D', '\u0C2D', '\u0D2D'];
    let i = 1;
    window.__bhaTimer = setInterval(() => {
      document.querySelectorAll('[data-bha]').forEach((el) => { el.textContent = G[i % G.length]; });
      i++;
    }, 1400);
  }
  renderVals() { return { tagline: this.props.tagline ?? 'WE ARE HERE' }; }
}
</script>
</body>
</html>
