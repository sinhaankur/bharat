  <text x="90" y="582" font-family="monospace" font-size="22" fill="#5ec99a">money flow · chain of command · severity · bias</text>
  <text x="1110" y="582" text-anchor="end" font-family="monospace" font-size="20" fill="#a0a0a0">PDF-cited or it's a gap</text>
