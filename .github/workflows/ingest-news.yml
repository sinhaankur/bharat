name: Ingest news feeds

# The "server" for news ingestion — a free scheduled runner, no server to manage.
# Runs ingest_news.py (stdlib RSS/Atom scraper, link + snippet only — never republishes
# article text) and AUTO-COMMITS news-feed.json every 6h, so feed.html always shows
# present India headlines. The Bias + Sentiment + accountability engines run on top of it
# in the browser. Source = open RSS feeds listed in feeds.json (ToS-friendly aggregation).

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch: {}       # also runnable on-demand from the Actions tab

permissions:
  contents: write             # allow committing the refreshed feed

concurrency:
  group: ingest-news
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the aggregator (RSS → news-feed.json)
        run: python3 ingest_news.py || true   # don't fail the run if some feeds are down

      - name: Commit the refreshed feed
        run: |
          if [ ! -s news-feed.json ]; then
            echo "no news-feed.json produced — skipping commit"; exit 0
          fi
          git config user.name  "bharat-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news-feed.json
          if git diff --cached --quiet; then
            echo "no change in news-feed.json"; exit 0
          fi
          count=$(python3 -c "import json;print(len(json.load(open('news-feed.json')).get('news_items',[])))" 2>/dev/null || echo "?")
          # NO [skip ci] — this commit SHOULD trigger deploy-app.yml (it matches *.json)
          # so the refreshed feed actually reaches the live site.
          git commit -m "News feed: refresh RSS aggregate (${count} items)"
          git push
          echo "### News feed refreshed — ${count} items committed" >> $GITHUB_STEP_SUMMARY
