name: Deploy to GitHub Pages (atlas + Mauryan app)

# Publishes BOTH in one Pages deployment:
#   /india-fiscal-map/      → the existing 55-page static atlas (repo root)
#   /india-fiscal-map/app/  → the new Mauryan-designed Next app (static export)
# Nothing on the atlas breaks; the new app lives under /app/.
# (Pages serves only static files — the app's /api/news becomes a build snapshot;
#  the /news page also falls back to sample data client-side.)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'interactive-vercel-ship-26-i-2/**'
      - '.github/workflows/deploy-app.yml'
      - '*.html'
      - '*.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: interactive-vercel-ship-26-i-2/pnpm-lock.yaml

      - name: Build the Next app (static export)
        working-directory: interactive-vercel-ship-26-i-2
        env:
          NODE_ENV: production
          BASE_PATH: /india-fiscal-map/app
        run: |
          # --ignore-scripts skips native postinstalls (esp. sharp), which pnpm
          # 10+ otherwise blocks and fatally errors on (ERR_PNPM_IGNORED_BUILDS).
          # Safe here: this is a STATIC EXPORT, sharp's native binary isn't needed
          # at build time. .npmrc shamefully-hoist keeps @tailwindcss/postcss
          # resolvable by Turbopack. Call the next binary directly.
          pnpm install --no-frozen-lockfile --ignore-scripts
          ./node_modules/.bin/next build

      - name: Assemble the Pages site (atlas at root + app under /app)
        run: |
          mkdir -p _site
          # 1) the static atlas = everything in the repo root except build/dev dirs
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude '_site' \
                --exclude 'interactive-vercel-ship-26-i-2' --exclude '.github' \
                --exclude '.venv-font' --exclude '__pycache__' \
                ./ _site/
          # 2) the new app under /app
          mkdir -p _site/app
          cp -r interactive-vercel-ship-26-i-2/out/* _site/app/
          # 3) Pages needs .nojekyll to serve _next/ (underscore) folders
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
