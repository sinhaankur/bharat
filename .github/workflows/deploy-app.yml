name: Deploy to GitHub Pages (atlas + Mauryan app)

# Publishes BOTH in one Pages deployment:
#   /bharat/      → the existing 55-page static atlas (repo root)
#   /bharat/app/  → the new Mauryan-designed Next app (static export)
# Nothing on the atlas breaks; the new app lives under /app/.
# (Pages serves only static files — the app's /api/news becomes a build snapshot;
#  the /news page also falls back to sample data client-side.)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'atlas-app/**'
      - '.github/workflows/deploy-app.yml'
      - '*.html'
      - '*.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: atlas-app/package-lock.json

      - name: Build the Next app (static export)
        working-directory: atlas-app
        env:
          NODE_ENV: production
          BASE_PATH: /bharat/app
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          # atlas-app is a plain Next 16 static-export app (no Tailwind, tokens are
          # CSS vars). npm ci --ignore-scripts skips sharp's native postinstall,
          # which isn't needed for a static export.
          # --webpack: the default Turbopack production build crashes the page-data
          # workers on the Pages runner (exits 1 with no output right after compile);
          # the stable webpack builder exports cleanly. Call the next binary directly.
          npm ci --ignore-scripts
          ./node_modules/.bin/next build --webpack

      - name: Assemble the Pages site (atlas at root + app under /app)
        run: |
          mkdir -p _site
          # 1) the classic 594-district atlas = everything in the repo root except
          #    build/dev dirs and BOTH app dirs (the parked old app + the new one).
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude '_site' \
                --exclude 'atlas-app' --exclude 'interactive-vercel-ship-26-i-2' \
                --exclude '.github' --exclude '.venv-font' --exclude '__pycache__' \
                ./ _site/
          # 2) the rebuilt Modernist × Mauryan app under /app
          mkdir -p _site/app
          cp -r atlas-app/out/* _site/app/
          # 3) Pages needs .nojekyll to serve _next/ (underscore) folders
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
