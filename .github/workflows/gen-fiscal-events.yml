name: Generate fiscal-event story-chains

# The auto-bot behind the News Journey (news-journey.html). After the news ingest
# refreshes news-feed.json, this clusters the scheme-anchored items into story-chains
# in fiscal-events.json (gen_fiscal_events.py) and auto-commits — so the Journey grows
# on its own. HONEST by construction: generated chains are confidence "reported" (news
# only, never "documented"), figures only if cited, curated chains preserved. Stdlib only.

on:
  schedule:
    - cron: "30 */6 * * *"   # 30 min after ingest-news.yml (which runs on the hour /6h)
  workflow_dispatch: {}       # also runnable on-demand from the Actions tab

permissions:
  contents: write             # allow committing the regenerated fiscal-events.json

concurrency:
  group: gen-fiscal-events
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cluster anchored news into story-chains
        run: python3 gen_fiscal_events.py || true   # never fail the run

      - name: Commit the regenerated chains
        run: |
          if [ ! -s fiscal-events.json ]; then
            echo "no fiscal-events.json produced — skipping commit"; exit 0
          fi
          # safety: refuse to commit if the curated (generated=false) chains vanished
          curated=$(python3 -c "import json;print(sum(1 for c in json.load(open('fiscal-events.json')).get('story_chains',[]) if not c.get('generated')))" 2>/dev/null || echo 0)
          if [ "$curated" -lt 1 ]; then
            echo "curated chains missing — refusing to commit (would clobber hand-authored data)"; exit 0
          fi
          git config user.name  "bharat-fiscal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fiscal-events.json
          if git diff --cached --quiet; then
            echo "no change in fiscal-events.json"; exit 0
          fi
          chains=$(python3 -c "import json;print(len(json.load(open('fiscal-events.json')).get('story_chains',[])))" 2>/dev/null || echo "?")
          # NO [skip ci] — this commit SHOULD trigger deploy-app.yml so the live Journey updates.
          git commit -m "News Journey: regenerate fiscal-event chains (${chains} chains)"
          git push
          echo "### Fiscal-event chains regenerated — ${chains} chains" >> $GITHUB_STEP_SUMMARY
