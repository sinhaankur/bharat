<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
function buildNagara() {
const g = new THREE.Group();
const sand = new THREE.MeshStandardMaterial({ name: 'sandstone', color: 0xd9b489, roughness: 0.92 });
const sandDark = new THREE.MeshStandardMaterial({ name: 'sandstone_dark', color: 0xb08a58, roughness: 0.95 });
const brass = new THREE.MeshStandardMaterial({ name: 'brass', color: 0xd9a92f, roughness: 0.45, metalness: 0.35 });
const verm = new THREE.MeshStandardMaterial({ name: 'vermilion', color: 0xc1440e, roughness: 0.8 });
const box = (name, mat, w, h, d, x, y, z) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name; m.position.set(x, y, z); g.add(m); return m;
};
// cross-plan (panchratha) block: three overlapping boxes
const ratha = (name, mat, w, h, y, proj) => {
  box(name + '_core', mat, w, h, w, 0, y, 0);
  box(name + '_bhadra_x', mat, w + proj * 2, h * 0.96, w * 0.62, 0, y, 0.001);
  box(name + '_bhadra_z', mat, w * 0.62, h * 0.96, w + proj * 2, 0.001, y, 0);
};
// adhisthana — moulded plinth courses
let y = 0;
[[15.6, 0.35], [15, 0.7], [14.3, 0.35], [13.8, 0.55], [14.05, 0.22], [13.1, 0.6], [12.75, 0.28], [12.5, 0.5]].forEach(([w, h], i) => {
  if (h < 0.4) {
    const k = new THREE.Mesh(new THREE.CylinderGeometry(w / 2 * 0.99, w / 2 * 0.99, h, 36), sandDark);
    k.name = 'kumuda_' + i; k.position.y = y + h / 2; g.add(k);
  } else box('plinth_' + i, i % 2 ? sandDark : sand, w, h, w, 0, y + h / 2, 0);
  y += h;
});
const platY = y;
// jangha — sanctum wall block with ratha projections + string courses
ratha('jangha', sand, 7.4, 6, platY + 3, 0.7);
box('course_1', sandDark, 8.9, 0.28, 8.9, 0, platY + 4.4, 0);
box('course_2', sandDark, 8.9, 0.28, 8.9, 0, platY + 2.0, 0);
// jangha pilasters + devakoshtha niches with figures
for (let s = 0; s < 2; s++) {
  const sx = s ? 1 : -1;
  for (let k = -2; k <= 2; k++) box('pilaster_x' + s + '_' + (k + 2), sandDark, 0.22, 5.2, 0.5, sx * 4.42, platY + 3, k * 1.35 + 0.002);
  box('niche_frame_x' + s, sandDark, 0.3, 1.9, 1.3, sx * 4.55, platY + 3.1, 0);
  box('murti_x' + s, verm, 0.18, 1.3, 0.7, sx * 4.62, platY + 3.0, 0);
}
box('niche_frame_back', sandDark, 1.3, 1.9, 0.3, 0, platY + 3.1, -4.55);
box('murti_back', verm, 0.7, 1.3, 0.18, 0, platY + 3.0, -4.62);
// floral rosette medallions on the bhadra walls
[-1, 1].forEach((sxv, s) => {
  [-1.7, -0.57, 0.57, 1.7].forEach((zz, r) => {
    const ro = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.07, 8, 18), sandDark);
    ro.name = 'rosette_' + s + '_' + r; ro.rotation.y = Math.PI / 2;
    ro.position.set(sxv * 4.41, platY + 5.1, zz); g.add(ro);
    const rc = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), verm);
    rc.name = 'rosette_c_' + s + '_' + r; rc.position.set(sxv * 4.43, platY + 5.1, zz); g.add(rc);
  });
});
const towerBase = platY + 6;
// latina tower — w = W(1−t)^1.35, 15 tiers
const W0 = 7.0, TH = 16.5, N = 34;
for (let i = 0; i < N; i++) {
  const t = i / N, t2 = (i + 1) / N;
  const w = W0 * Math.pow(1 - t * 0.82, 1.35);
  const h = TH / N;
  ratha('tier_' + i, i % 3 === 2 ? sandDark : sand, w, h, towerBase + (i + 0.5) * h, w * 0.09);
  if (i % 4 === 3) for (let c = 0; c < 4; c++) {
    const sx = c % 2 ? 1 : -1, sz = c < 2 ? 1 : -1;
    const ca = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 12), sandDark);
    ca.name = 'corner_amalaka_' + i + '_' + c;
    ca.position.set(sx * w * 0.5, towerBase + (i + 1) * h, sz * w * 0.5); g.add(ca);
  }
}
// urahshringa — half-spires leaning on the front and back bhadra
[1, -1].forEach((zs, u) => {
  const w0 = 3.1, th = 6.8, n = 14, zoff = zs * 3.0;
  for (let i = 0; i < n; i++) {
    const w = w0 * Math.pow(1 - (i / n) * 0.82, 1.35), h = th / n;
    box('urah_' + u + '_tier_' + i, i % 3 === 2 ? sandDark : sand, w, h, w, 0, towerBase + (i + 0.5) * h, zoff);
  }
  const ua = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.3, 20), sandDark);
  ua.name = 'urah_' + u + '_amalaka'; ua.position.set(0, towerBase + th + 0.15, zoff); g.add(ua);
  box('urah_' + u + '_kalasha', brass, 0.16, 0.5, 0.16, 0, towerBase + th + 0.55, zoff);
});
const topY = towerBase + TH;
// skandha + amalaka (ribbed crown)
box('skandha', sandDark, 1.7, 0.5, 1.7, 0, topY + 0.25, 0);
const am = new THREE.Mesh(new THREE.TorusGeometry(1.28, 0.45, 16, 40), sand);
am.name = 'amalaka'; am.rotation.x = Math.PI / 2; am.position.y = topY + 0.9; g.add(am);
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2;
  const rib = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), sandDark);
  rib.name = 'amalaka_rib_' + i;
  rib.position.set(Math.cos(a) * 1.55, topY + 0.9, Math.sin(a) * 1.55);
  rib.scale.set(1, 1.4, 1); g.add(rib);
}
// kalasha finial — lathe profile
const pts = [[0.02, 0], [0.34, 0.06], [0.46, 0.34], [0.3, 0.72], [0.12, 0.86], [0.2, 1.05], [0.03, 1.3], [0.01, 1.45]].map(([x, yy]) => new THREE.Vector2(x, yy));
const kal = new THREE.Mesh(new THREE.LatheGeometry(pts, 32), brass);
const am2 = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.26, 14, 32), sand);
am2.name = 'amalaka_upper'; am2.rotation.x = Math.PI / 2; am2.position.y = topY + 1.5; g.add(am2);
const cand = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.16, 20), sandDark);
cand.name = 'candrika'; cand.position.y = topY + 1.78; g.add(cand);
kal.name = 'kalasha'; kal.position.y = topY + 1.86; g.add(kal);
// mandapa — pillared hall with phamsana (stepped) roof
const mz = 8.6;
box('mandapa', sand, 6.2, 4.2, 5.4, 0, platY + 2.1, mz);
[[6.8, 0.55], [5.6, 0.55], [4.4, 0.5], [3.2, 0.5], [2.0, 0.45], [0.9, 0.4]].forEach(([w, h], i) => {
  box('phamsana_' + i, i % 2 ? sandDark : sand, w, h, w * 0.85, 0, platY + 4.2 + h / 2 + i * 0.48, mz);
});
box('mandapa_kalasha', brass, 0.3, 0.7, 0.3, 0, platY + 7.6, mz);
// doorway + tilaka mark
for (let c = 0; c < 2; c++) {
  const sx = c ? 1 : -1, px = sx * 2.4, pz = mz + 3.35, H = platY + 3.4;
  box('col_base_' + c, sandDark, 0.72, 0.5, 0.72, px, 0.25, pz);
  const sh1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, H * 0.45, 8), sand);
  sh1.name = 'col_shaft_oct_' + c; sh1.position.set(px, 0.5 + H * 0.225, pz); g.add(sh1);
  const sh2 = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.3, H * 0.4, 20), sand);
  sh2.name = 'col_shaft_round_' + c; sh2.position.set(px, 0.5 + H * 0.65, pz); g.add(sh2);
  const cu = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.13, 10, 24), sandDark);
  cu.name = 'col_cushion_' + c; cu.rotation.x = Math.PI / 2; cu.position.set(px, 0.6 + H * 0.85, pz); g.add(cu);
  box('col_abacus_' + c, sandDark, 0.85, 0.2, 0.85, px, 0.78 + H * 0.85, pz);
}
box('chhajja', sandDark, 6.2, 0.24, 1.9, 0, platY + 3.75, mz + 3.2);
box('doorframe', sandDark, 1.9, 3.1, 0.25, 0, platY + 1.55, mz + 2.71);
box('door', verm, 1.3, 2.6, 0.12, 0, platY + 1.3, mz + 2.76);
box('dvarapala_l', sandDark, 0.4, 1.5, 0.22, -1.3, platY + 0.75, mz + 2.8);
box('dvarapala_r', sandDark, 0.4, 1.5, 0.22, 1.3, platY + 0.75, mz + 2.8);
box('tilaka', verm, 0.9, 0.5, 0.1, 0, towerBase + 1.2, 4.15);
// entrance stair — solid steps climbing to the plinth top against the mandapa front
for (let i = 0; i < 6; i++) {
  const h = platY - 0.5 * i;
  box('step_' + i, sandDark, 3.4, h, 0.75, 0, h / 2, mz + 2.71 + 0.375 + 0.75 * i);
}
// center whole group on origin, base at y=0
g.position.set(0, 0, -2);
return g;
}
function mats(base, dark) {
  return {
    a: new THREE.MeshStandardMaterial({ name: 'stone', color: base, roughness: 0.92 }),
    b: new THREE.MeshStandardMaterial({ name: 'stone_dark', color: dark, roughness: 0.95 }),
    br: new THREE.MeshStandardMaterial({ name: 'brass', color: 0xd9a92f, roughness: 0.45, metalness: 0.35 }),
    v: new THREE.MeshStandardMaterial({ name: 'vermilion', color: 0xc1440e, roughness: 0.8 })
  };
}
function buildDravida() {
  const g = new THREE.Group(), M = mats(0x9a8f80, 0x6e6458);
  const B = (n, m, w, hh, d, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), m); o.name = n; o.position.set(x, y, z); g.add(o); return o; };
  B('platform', M.b, 16, 1.2, 16, 0, 0.6, 0);
  B('base_storey_1', M.a, 9, 4, 9, 0, 3.2, 0);
  B('cornice_1', M.b, 9.8, 0.5, 9.8, 0, 5.45, 0);
  B('base_storey_2', M.a, 8.4, 3, 8.4, 0, 7.2, 0);
  B('cornice_2', M.b, 9.2, 0.5, 9.2, 0, 8.95, 0);
  for (let s = 0; s < 2; s++) for (let k = -1; k <= 1; k++) { B('niche_s' + s + '_' + (k + 1), M.b, 0.25, 2.2, 1.1, (s ? 1 : -1) * 4.52, 3.2, k * 2.6); B('murti_s' + s + '_' + (k + 1), M.v, 0.16, 1.4, 0.6, (s ? 1 : -1) * 4.58, 3.1, k * 2.6); }
  const N = 13, y0 = 9.2;
  for (let i = 0; i < N; i++) {
    const w = 8 - (5.9 / (N - 1)) * i, hh = 1.02;
    B('tier_' + i, i % 3 === 2 ? M.b : M.a, w, hh, w, 0, y0 + (i + 0.5) * hh, 0);
    if (i % 2 === 0 && i < N - 2) for (let c = 0; c < 4; c++) B('kuta_' + i + '_' + c, M.b, 0.5, 0.5, 0.5, (c % 2 ? 1 : -1) * (w / 2 - 0.3), y0 + (i + 1) * hh + 0.2, (c < 2 ? 1 : -1) * (w / 2 - 0.3));
  }
  const topY = y0 + N * 1.02;
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.5, 1.1, 8), M.a); drum.name = 'griva'; drum.position.y = topY + 0.55; g.add(drum);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(1.75, 24, 16), M.b); dome.name = 'kumbam_80t'; dome.scale.y = 0.72; dome.position.y = topY + 1.9; g.add(dome);
  B('stupi', M.br, 0.22, 1.3, 0.22, 0, topY + 3.5, 0);
  B('mandapa_hall', M.a, 5.4, 3.2, 9, 0, 2.8, 9.2);
  B('mandapa_roof', M.b, 6, 0.5, 9.6, 0, 4.65, 9.2);
  for (let i = 0; i < 8; i++) B('wall_stripe_' + i, i % 2 ? M.v : M.a, 1.6, 1.4, 0.4, -5.6 + i * 1.6, 1.9, 14.4);
  for (let i = 0; i < 4; i++) { const hh2 = 1.9 - 0.45 * i; B('step_' + i, M.b, 3, hh2, 0.7, 0, 1.2 + hh2 / 2 - 1.2 + 0.0, 13.9 + 0.35 + 0.7 * i); }
  return g;
}
function buildKalinga() {
  const g = new THREE.Group(), M = mats(0x8a6f4d, 0x5d4630);
  const B = (n, m, w, hh, d, x, y, z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), m); o.name = n; o.position.set(x, y, z); g.add(o); return o; };
  const cross = (n, m, w, hh, y, p) => { B(n + '_core', m, w, hh, w, 0, y, 0); B(n + '_px', m, w + p * 2, hh * 0.97, w * 0.6, 0, y, 0.001); B(n + '_pz', m, w * 0.6, hh * 0.97, w + p * 2, 0.001, y, 0); };
  B('platform', M.b, 15, 1.1, 15, 0, 0.55, 0);
  cross('bada', M.a, 6.6, 5, 3.6, 0.8);
  B('bandhana', M.b, 8.4, 0.4, 8.4, 0, 3.7, 0);
  const N = 16, y0 = 6.1, TH = 13;
  for (let i = 0; i < N; i++) {
    const t = i / N, w = 6.4 * (1 - Math.pow(t, 2.4) * 0.78), hh = TH / N;
    cross('gandi_' + i, i % 4 === 3 ? M.b : M.a, w, hh, y0 + (i + 0.5) * hh, w * 0.1);
  }
  const topY = y0 + TH;
  const beki = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 0.9, 24), M.b); beki.name = 'beki'; beki.position.y = topY + 0.45; g.add(beki);
  const am = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.55, 16, 40), M.a); am.name = 'amalaka'; am.rotation.x = Math.PI / 2; am.position.y = topY + 1.3; g.add(am);
  const kh = new THREE.Mesh(new THREE.SphereGeometry(0.95, 22, 14), M.b); kh.name = 'khapuri'; kh.scale.y = 0.55; kh.position.y = topY + 2.15; g.add(kh);
  B('kalasha', M.br, 0.26, 1.1, 0.26, 0, topY + 3, 0);
  const jz = 7.6;
  B('jagamohana', M.a, 6.4, 3.6, 5.8, 0, 2.9, jz);
  for (let i = 0; i < 7; i++) { const w = 7 - i * 0.9; B('pidha_' + i, i % 2 ? M.b : M.a, w, 0.5, w * 0.85, 0, 4.95 + i * 0.5, jz); }
  B('pidha_kalasha', M.br, 0.2, 0.8, 0.2, 0, 8.85, jz);
  for (let s = 0; s < 2; s++) {
    const x = s ? 7.6 : -7.6;
    const wl = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.3, 12, 28), M.b); wl.name = 'wheel_' + s; wl.rotation.y = Math.PI / 2; wl.position.set(x, 1.55, 2); g.add(wl);
    for (let k = 0; k < 8; k++) { const sp = new THREE.Mesh(new THREE.BoxGeometry(0.14, 2.2, 0.14), M.a); sp.name = 'spoke_' + s + '_' + k; sp.rotation.x = (k / 8) * Math.PI; sp.position.set(x, 1.55, 2); g.add(sp); }
