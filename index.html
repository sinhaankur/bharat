<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bharat — Money, Land &amp; Memory</title>
  <meta name="description" content="An atlas of India — its money and power, its land and rivers, its scripts and faiths. Sourced, per-district, open." />
  <link rel="canonical" href="https://sinhaankur.github.io/bharat/next/" />
  <!-- The front door is the new rebuild (next/): the 15-skin WebGL design, latest work.
       ?app  → the classic atlas (app/).  ?hero → the cinematic 3D flyover (hero-3d.html).
       The classic India map lives at classic.html. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      // default → the new rebuild. Opt into the older atlas (?app) or the flyover (?hero).
      var dest = p.has('hero') ? 'hero-3d.html' : p.has('app') ? 'app/' : 'next/';
      location.replace(dest + location.search.replace(/[?&](hero|app)\b/g, '') + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=next/" /></noscript>
  <style>
    html,body{margin:0;height:100%;background:#f8f4ea;color:#33251a;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
      height:100%;gap:1rem;text-align:center}
    a{color:#cc8900;font-weight:700;text-decoration:none}
    .spin{width:34px;height:34px;border:3px solid #e7dcc4;border-top-color:#cc8900;
      border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spin{animation:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spin" aria-hidden="true"></div>
    <p>Taking you to <strong>Bharat</strong>…<br />
      <a href="next/">Enter Bharat</a> · <a href="app/">the classic atlas</a> · <a href="classic.html">the map</a> · <a href="index.html?hero">the flyover</a></p>
  </div>
</body>
</html>
