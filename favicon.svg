<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bharat mark: the "meridian B" — a line of longitude that bends into a B,
       with a crimson node marking a located point on the meridian (a district). -->
  <rect width="32" height="32" rx="7" fill="#16151a"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
    <path d="M11 7 v18"/>
    <path d="M11 8 h4.5 a4.5 4.5 0 0 1 0 9 h-4.5"/>
    <path d="M11 16 h6 a4.5 4.5 0 0 1 0 9 h-6"/>
  </g>
  <circle cx="11" cy="16" r="2.4" fill="#d33a2c"/>
</svg>
